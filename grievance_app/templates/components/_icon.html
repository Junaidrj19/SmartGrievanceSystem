{% macro icon(name, size=18, class_name='') -%}
<svg class="icon {{ class_name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
  {% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
  {% elif name == 'inbox' %}<path d="M4 4h16v14H4z"/><path d="M4 13h4l2 3h4l2-3h4"/>
  {% elif name == 'clock' %}<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>
  {% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
  {% elif name == 'alert' %}<path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v4M12 17h.01"/>
  {% elif name == 'arrow' %}<path d="M5 12h13M13 6l6 6-6 6"/>
  {% elif name == 'arrow-up-right' %}<path d="M7 17 17 7M8 7h9v9"/>
  {% elif name == 'filter' %}<path d="M4 6h16M7 12h10M10 18h4"/>
  {% elif name == 'chevron' %}<path d="m9 5 7 7-7 7"/>
  {% elif name == 'clipboard' %}<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M8 10h8M8 14h6"/>
  {% elif name == 'shield' %}<path d="M12 3 19 6v5c0 4.5-3 7.8-7 10-4-2.2-7-5.5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/>
  {% elif name == 'user' %}<circle cx="12" cy="8" r="3"/><path d="M5 20c.5-3.2 3-5 7-5s6.5 1.8 7 5"/>
  {% elif name == 'logout' %}<path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"/>
  {% elif name == 'search' %}<circle cx="10.8" cy="10.8" r="6.2"/><path d="m16 16 4.5 4.5"/>
  {% elif name == 'spark' %}<path d="m12 3 1.4 5.6L19 10l-5.6 1.4L12 17l-1.4-5.6L5 10l5.6-1.4L12 3ZM19 16l.6 2.4L22 19l-2.4.6L19 22l-.6-2.4L16 19l2.4-.6L19 16Z"/>
  {% elif name == 'back' %}<path d="M19 12H5M11 6l-6 6 6 6"/>
  {% elif name == 'location' %}<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.2"/>
  {% elif name == 'calendar' %}<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>
  {% elif name == 'layers' %}<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m4 12 8 4.5 8-4.5M4 16l8 5 8-5"/>
  {% elif name == 'menu' %}<path d="M4 7h16M4 12h16M4 17h16"/>
  {% elif name == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/>
  {% elif name == 'phone' %}<path d="M7 3h3l1.6 4-2 1.4a11 11 0 0 0 5 5l1.4-2 4 1.6v3a2 2 0 0 1-2.2 2A16 16 0 0 1 5 5.2 2 2 0 0 1 7 3Z"/>
  {% elif name == 'eye-off' %}<path d="M3 3l18 18M10.6 10.7a2 2 0 0 0 2.8 2.8"/><path d="M6.5 6.6C4.6 7.9 3.2 9.8 2.5 12c1.5 4 5.2 6.5 9.5 6.5 1.6 0 3.1-.35 4.4-1M9.9 5.7A9.6 9.6 0 0 1 12 5.5c4.3 0 8 2.5 9.5 6.5-.5 1.4-1.3 2.7-2.3 3.7"/>
  {% elif name == 'compass' %}<circle cx="12" cy="12" r="8.5"/><path d="m14.8 9.2-1.7 4.1-4.1 1.7 1.7-4.1 4.1-1.7Z"/>
  {% elif name == 'chart' %}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
  {% elif name == 'hash' %}<path d="M9 3 7.5 21M16.5 3 15 21M3.5 8.5h17M3 15.5h17"/>
  {% elif name == 'refresh' %}<path d="M20 11a8 8 0 0 0-13.6-4.6L3 9"/><path d="M3 4v5h5"/><path d="M4 13a8 8 0 0 0 13.6 4.6L21 15"/><path d="M21 20v-5h-5"/>
  {% elif name == 'lock' %}<rect x="4.5" y="10" width="15" height="10.5" rx="2"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>
  {% elif name == 'users' %}<circle cx="9" cy="8" r="3"/><path d="M3 20c.4-3 2.5-4.8 6-4.8S14.6 17 15 20"/><path d="M16 5.3a3 3 0 0 1 0 5.4M18 20c-.2-1.6-.8-2.9-1.8-3.8"/>
  {% elif name == 'scale' %}<path d="M12 4v16M7 20h10M12 7 5 9l2.5 5a3.5 3.5 0 0 0 5 0L12 7Zm0 0 7 2-2.5 5a3.5 3.5 0 0 1-5 0"/>
  {% else %}<circle cx="12" cy="12" r="8"/>{% endif %}
</svg>
{%- endmacro %}
